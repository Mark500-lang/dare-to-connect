workflows:
  ios-release:
    name: Dare to Connect iOS Release Build
    integrations:
      app_store_connect: codemagic-key
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        NODE_VERSION: "22.x"
        COCOAPODS_VERSION: "1.15.2"
        DEVELOPMENT_TEAM: "H9A4H444G4"
        BUNDLE_ID: "daretoconnect.app.mobile"
        CI: "false"
        DISABLE_ESLINT_PLUGIN: "true"
        # IAP product identifiers — must match App Store Connect exactly
        IAP_SOCIAL:   "com.daretoconnect.pack.social"
        IAP_COUPLES:  "com.daretoconnect.pack.couples"
        IAP_WELLNESS: "com.daretoconnect.pack.wellness"
        IAP_CAREER:   "com.daretoconnect.pack.career"
        IAP_BUNDLE:   "com.daretoconnect.pack.bundle"
      groups:
        - DareToConnect   # Must contain: CERTIFICATE, CERTIFICATE_PASSWORD,
                          # PROVISIONING_PROFILE, REACT_APP_REVENUECAT_IOS_API_KEY,
                          # REACT_APP_API_KEY
      node: 22
      xcode: latest

    cache:
      cache_paths:
        - ~/.npm
        - node_modules
        - ios/Pods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
        - pattern: develop
          include: true

    scripts:

      # ── PHASE 1: CLEAN ────────────────────────────────────────────────────────
      - name: Clean Workspace
        script: |
          echo "=== Cleaning Workspace ==="
          rm -rf node_modules ios/Pods ios/App/Pods
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ios/Pods ios/App/Pods ios/Podfile.lock
          npm cache clean --force

      # ── PHASE 2: DEPENDENCIES ─────────────────────────────────────────────────
      - name: Install Dependencies
        script: |
          set -ex
          echo "=== Installing Node Modules ==="
          rm -rf node_modules package-lock.json
          npm install
          npm install --save-dev @babel/plugin-proposal-private-property-in-object
          npx update-browserslist-db@latest

          echo "=== Verifying key package installations ==="
          for pkg in \
            "@capacitor/core" \
            "@capacitor/ios" \
            "@capacitor/android" \
            "@capacitor/app" \
            "@capacitor/browser" \
            "@capacitor/device" \
            "@capacitor/status-bar" \
            "@capacitor/cli" \
            "@revenuecat/purchases-capacitor"; do
            if [ -d "node_modules/$pkg" ]; then
              echo "✅ $pkg: $(node -p "require('$pkg/package.json').version")"
            else
              echo "❌ $pkg NOT FOUND"
              exit 1
            fi
          done
          echo "✅ All dependencies verified"

      # ── PHASE 3: BUILD REACT APP ──────────────────────────────────────────────
      - name: Build React App
        script: |
          set -ex
          echo "=== Building React App ==="
          export DISABLE_ESLINT_PLUGIN=true
          export ESLINT_NO_DEV_ERRORS=false

          # Inject RevenueCat iOS key from environment group into the build
          echo "REACT_APP_REVENUECAT_IOS_API_KEY=$REACT_APP_REVENUECAT_IOS_API_KEY" >> .env.production
          echo "REACT_APP_API_KEY=$REACT_APP_API_KEY" >> .env.production

          npm run build

          if [ ! -d "build" ]; then
            echo "❌ React build failed — build directory not found"
            exit 1
          fi
          echo "✅ React build completed"

      # ── PHASE 4: CAPACITOR SYNC + POD INSTALL ────────────────────────────────
      - name: Sync Capacitor and Configure IAP
        script: |
          set -ex

          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

          npx cap copy ios

          cd ios/App
          rm -rf Pods Podfile.lock Podfile
          rm -rf ~/.cocoapods/repos/trunk/
          pod cache clean --all
          pod repo remove trunk || true
          pod setup

          cat > Podfile << 'EOF'
          platform :ios, '15.0'
          use_frameworks! :linkage => :static

          install! 'cocoapods', :deterministic_uuids => false, :integrate_targets => true

          target 'App' do
            # ── Capacitor core ────────────────────────────────────────────────
            pod 'Capacitor',        :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorApp',     :path => '../../node_modules/@capacitor/app'
            pod 'CapacitorBrowser', :path => '../../node_modules/@capacitor/browser'
            pod 'CapacitorDevice',  :path => '../../node_modules/@capacitor/device'
            pod 'CapacitorStatusBar', :path => '../../node_modules/@capacitor/status-bar'

            # ── RevenueCat — required for non-consumable IAP ──────────────────
            pod 'RevenuecatPurchasesCapacitor', :path => '../../node_modules/@revenuecat/purchases-capacitor'
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['SWIFT_VERSION'] = '5.0'
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                unless target.product_type == "com.apple.product-type.bundle"
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                end
              end
            end
          end
          EOF

          pod install --repo-update

          # Verify RevenueCat was installed
          if grep -q "RevenuecatPurchasesCapacitor" Podfile.lock; then
            echo "✅ RevenueCat successfully installed"
          else
            echo "❌ RevenueCat not found in Podfile.lock — IAP will not work"
            exit 1
          fi

          cd ../..
          echo "✅ iOS dependencies configured"

      # ── PHASE 5: ENTITLEMENTS — IAP + PUSH ───────────────────────────────────
      - name: Configure Entitlements
        script: |
          set -ex
          ENTITLEMENTS_PATH="ios/App/App/App.entitlements"

          # Overwrite whatever is in the repo — only push notifications needed
          # com.apple.developer.in-app-payments is NOT required for StoreKit/RevenueCat IAP
          cat > "$ENTITLEMENTS_PATH" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF

          echo "✅ Entitlements written:"
          cat "$ENTITLEMENTS_PATH"

          cd ios/App
          if grep -q "CODE_SIGN_ENTITLEMENTS" App.xcodeproj/project.pbxproj; then
            sed -i '' \
              's|CODE_SIGN_ENTITLEMENTS = .*|CODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' \
              App.xcodeproj/project.pbxproj
          else
            sed -i '' \
              '/ALWAYS_SEARCH_USER_PATHS/a\
              CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' \
              App.xcodeproj/project.pbxproj
          fi
          echo "✅ Entitlements referenced in pbxproj"

      # ── PHASE 6: XCODE SCHEME ────────────────────────────────────────────────
      - name: Create Xcode Scheme
        script: |
          set -ex
          cd ios/App
          mkdir -p App.xcodeproj/xcshareddata/xcschemes

          cat > App.xcodeproj/xcshareddata/xcschemes/App.xcscheme << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1500" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="1DF1B9C3257A6D4E00F1B1A6" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"/>
                </BuildActionEntry>
              </BuildActionEntries>
            </BuildAction>
            <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES" codeCoverageEnabled="YES">
              <Testables/>
            </TestAction>
            <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
              <BuildableProductRunnable runnableDebuggingMode="0">
                <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="1DF1B9C3257A6D4E00F1B1A6" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"/>
              </BuildableProductRunnable>
            </LaunchAction>
            <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES">
              <BuildableProductRunnable runnableDebuggingMode="0">
                <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="1DF1B9C3257A6D4E00F1B1A6" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"/>
              </BuildableProductRunnable>
            </ProfileAction>
            <AnalyzeAction buildConfiguration="Debug"/>
            <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"/>
          </Scheme>
          EOF
          echo "✅ Xcode scheme created"

      # ── PHASE 7: CODE SIGNING ─────────────────────────────────────────────────
      - name: Configure Signing
        script: |
          set -ex
          cd ios/App

          echo "$CERTIFICATE"            | base64 --decode > signing.p12
          echo "$PROVISIONING_PROFILE"   | base64 --decode > profile.mobileprovision

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin \
            <<< $(security cms -D -i profile.mobileprovision 2>/dev/null))
          TEAM_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin \
            <<< $(security cms -D -i profile.mobileprovision 2>/dev/null))

          echo "Profile UUID: $PROFILE_UUID"
          echo "Team ID: $TEAM_IDENTIFIER"

          security create-keychain -p "" build.keychain
          security import signing.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          # Bundle ID
          sed -i '' \
            "s/PRODUCT_BUNDLE_IDENTIFIER = com\.yourcompany\.daretoconnect/PRODUCT_BUNDLE_IDENTIFIER = daretoconnect.app.mobile/g" \
            App.xcodeproj/project.pbxproj
          sed -i '' \
            "s/PRODUCT_BUNDLE_IDENTIFIER = com\.example\.[^;]*/PRODUCT_BUNDLE_IDENTIFIER = daretoconnect.app.mobile/g" \
            App.xcodeproj/project.pbxproj

          grep -q "daretoconnect.app.mobile" App.xcodeproj/project.pbxproj \
            && echo "✅ Bundle ID set" \
            || { echo "❌ Bundle ID not set"; exit 1; }

          # Provisioning profile specifier
          sed -i '' \
            "s|CODE_SIGN_STYLE = Manual;|CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\";|g" \
            App.xcodeproj/project.pbxproj

          # Deployment target
          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 14.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' \
            App.xcodeproj/project.pbxproj

          # Code sign identity
          sed -i '' \
            's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = "iPhone Distribution"/g' \
            App.xcodeproj/project.pbxproj
          sed -i '' \
            's/CODE_SIGN_IDENTITY = "iOS Developer"/CODE_SIGN_IDENTITY = "iPhone Distribution"/g' \
            App.xcodeproj/project.pbxproj
          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' \
            App.xcodeproj/project.pbxproj

          echo "PROFILE_UUID=$PROFILE_UUID"       >> $CM_ENV
          echo "TEAM_IDENTIFIER=$TEAM_IDENTIFIER" >> $CM_ENV

          # Clear signing from Pod targets
          find Pods -name "*.xcconfig" | xargs sed -i '' '/PROVISIONING_PROFILE/d' 2>/dev/null || true

          ruby - << 'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Pods/Pods.xcodeproj')
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              unless target.product_type == "com.apple.product-type.bundle"
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              end
            end
          end
          project.save
          RUBY

          find Pods -name "*.xcconfig" | while read f; do
            sed -i '' '/PROVISIONING_PROFILE/d' "$f"
            sed -i '' '/CODE_SIGN_IDENTITY/d'   "$f"
          done

          echo "✅ Signing configuration complete"

      # ── PHASE 8: VERSION + BUILD NUMBER ──────────────────────────────────────
      - name: Configure Build Settings
        script: |
          set -ex
          cd ios/App/App
          PLIST_PATH="Info.plist"

          CURRENT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST_PATH" 2>/dev/null || echo "2.7")
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
          [ -z "$PATCH" ] && PATCH="0"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_BUILD=$(date +%s)

          echo "Version: $CURRENT_VERSION → $NEW_VERSION  Build: $NEW_BUILD"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEW_VERSION" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD"              "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID"          "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL"        "$PLIST_PATH" 2>/dev/null || true

          FINAL=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST_PATH")
          if [ -z "$FINAL" ] || [[ "$FINAL" == *"$"* ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 3.2" "$PLIST_PATH"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD"     "$PLIST_PATH"
          fi
          echo "✅ Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $PLIST_PATH) build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' $PLIST_PATH)"

      # ── PHASE 9: INFO.PLIST — PRIVACY + DEEP LINK + IAP DISCLOSURE ───────────
      - name: Add Privacy Descriptions and IAP Disclosure
        script: |
          set -ex
          cd ios/App/App
          PLIST_PATH="Info.plist"

          # ── Status bar ────────────────────────────────────────────────────────
          /usr/libexec/PlistBuddy -c \
            "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :UIViewControllerBasedStatusBarAppearance false" "$PLIST_PATH"

          # ── Camera & photo library ────────────────────────────────────────────
          /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'Dare to Connect needs camera access to let you take a profile photo.'" \
            "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :NSCameraUsageDescription 'Dare to Connect needs camera access to let you take a profile photo.'" "$PLIST_PATH"

          /usr/libexec/PlistBuddy -c \
            "Add :NSPhotoLibraryUsageDescription string 'Dare to Connect needs photo library access to let you choose a profile photo.'" \
            "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :NSPhotoLibraryUsageDescription 'Dare to Connect needs photo library access to let you choose a profile photo.'" "$PLIST_PATH"

          /usr/libexec/PlistBuddy -c \
            "Add :NSPhotoLibraryAddUsageDescription string 'Dare to Connect needs permission to save photos to your library.'" \
            "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :NSPhotoLibraryAddUsageDescription 'Dare to Connect needs permission to save photos to your library.'" "$PLIST_PATH"

          # ── IAP: SKAdNetworkItems — required for StoreKit 2 / RevenueCat ─────
          # Apple requires this key when using StoreKit. Without it, IAP calls
          # may be silently rejected on some OS versions.
          /usr/libexec/PlistBuddy -c \
            "Delete :SKAdNetworkItems" "$PLIST_PATH" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c \
            "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string 2U9PT9HC89.skadnetwork" \
            "$PLIST_PATH"

          # ── IAP product list — helps OS pre-validate products at launch ───────
          /usr/libexec/PlistBuddy -c \
            "Delete :SKStoreProductParameterITunesItemIdentifier" "$PLIST_PATH" 2>/dev/null || true

          # Non-consumable type declaration (informational, not required by Apple
          # but useful for App Review context in the plist)
          /usr/libexec/PlistBuddy -c \
            "Add :IAPProductType string non-consumable" "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :IAPProductType non-consumable" "$PLIST_PATH"

          # ── Deep link URL scheme ──────────────────────────────────────────────
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST_PATH" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c \
            "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c \
            "Add :CFBundleURLTypes:0:CFBundleURLName string daretoconnect.app.mobile" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c \
            "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c \
            "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string daretoconnect" "$PLIST_PATH"

          # ── Encryption compliance ─────────────────────────────────────────────
          /usr/libexec/PlistBuddy -c \
            "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :ITSAppUsesNonExemptEncryption false" "$PLIST_PATH"

          echo "=== Verifying critical plist keys ==="
          for key in \
            NSCameraUsageDescription \
            NSPhotoLibraryUsageDescription \
            ITSAppUsesNonExemptEncryption \
            CFBundleURLTypes \
            SKAdNetworkItems \
            IAPProductType; do
            val=$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST_PATH" 2>/dev/null || echo "MISSING")
            echo "  $key: $val"
          done

          echo "✅ Info.plist fully configured"

      # ── PHASE 10: BUILD ARCHIVE ───────────────────────────────────────────────
      - name: Build Archive
        script: |
          set -ex
          cd ios/App
          mkdir -p build

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$TEAM_IDENTIFIER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="daretoconnect.app.mobile" \
            clean archive \
            2>&1 | tee build/xcodebuild.log

          [ -d "build/App.xcarchive" ] \
            && echo "✅ Archive created" \
            || { echo "❌ Archive failed"; exit 1; }

      # ── PHASE 11: EXPORT IPA ──────────────────────────────────────────────────
      - name: Export IPA
        script: |
          set -ex
          cd ios/App

          cat > build/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_IDENTIFIER</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>daretoconnect.app.mobile</key>
                  <string>$PROFILE_UUID</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <!-- Declare non-consumable IAP products for App Review -->
              <key>iCloudContainerEnvironment</key>
              <string>Production</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/exportOptions.plist

          [ -f "build/ipa/App.ipa" ] \
            && echo "✅ IPA exported ($(du -h build/ipa/App.ipa | cut -f1))" \
            || { echo "❌ IPA export failed"; find build/ipa -name "*.ipa" 2>/dev/null; exit 1; }

      # ── PHASE 12: VALIDATE + PREPARE ARTIFACTS ────────────────────────────────
      - name: Validate Build and Prepare Artifacts
        script: |
          set -ex
          echo "=== Validating IPA ==="

          [ -f "ios/App/build/ipa/App.ipa" ] || { echo "❌ IPA not found"; exit 1; }

          unzip -l "ios/App/build/ipa/App.ipa" | grep "Payload/App.app" || \
            { echo "❌ Invalid IPA structure"; exit 1; }

          TEMP_DIR=$(mktemp -d)
          unzip -q ios/App/build/ipa/App.ipa -d "$TEMP_DIR"
          codesign -dv --verbose=4 "$TEMP_DIR/Payload/App.app" 2>&1 \
            | grep -E 'Authority=Apple Distribution|TeamIdentifier=' \
            || { echo "❌ Signing verification failed"; exit 1; }
          rm -rf "$TEMP_DIR"

          # Check RevenueCat is in the binary
          if unzip -p ios/App/build/ipa/App.ipa "Payload/App.app/App" 2>/dev/null \
              | strings | grep -q "RevenueCat"; then
            echo "✅ RevenueCat found in binary"
          else
            echo "⚠️  RevenueCat string not found — verify RC pod was linked"
          fi

          # Check all 5 IAP product IDs are referenced in the binary
          echo "=== Checking IAP product IDs in binary ==="
          TEMP2=$(mktemp -d)
          unzip -q ios/App/build/ipa/App.ipa -d "$TEMP2"
          for product_id in \
            "com.daretoconnect.pack.social" \
            "com.daretoconnect.pack.couples" \
            "com.daretoconnect.pack.wellness" \
            "com.daretoconnect.pack.career" \
            "com.daretoconnect.pack.bundle"; do
            if strings "$TEMP2/Payload/App.app/App" | grep -q "$product_id"; then
              echo "  ✅ $product_id"
            else
              echo "  ⚠️  $product_id not found in binary strings (may be in JS bundle)"
            fi
          done
          rm -rf "$TEMP2"

          # Save plist for audit
          cd ios/App/App
          cp Info.plist Final_Info_Plist_Verification.plist
          echo "=== FINAL INFO.PLIST ===" > Info_Plist_Verification.txt
          /usr/libexec/PlistBuddy -c "Print" Info.plist >> Info_Plist_Verification.txt

          echo "✅ Validation complete"
          echo "📱 IPA: $(du -h ios/App/build/ipa/App.ipa | cut -f1)"

    artifacts:
      - ios/App/build/ipa/App.ipa
      - ios/App/App/Final_Info_Plist_Verification.plist
      - ios/App/App/Info_Plist_Verification.txt
      - ios/App/build/xcodebuild.log   # always save the build log for debugging

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true